<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>6. dblclick Event </h1>
    <p>Double-click the text below to change it.</p>
    <p id="target" class="box">Double-click this box</p>
    <script>
        const target= document.querySelector("#target");
        target.addEventListener("dblclick", () =>{
            target.textContent= "You double-clicked the box!";
            target.style.backgroundColor="#bbf7d0";
        });
    </script>
</body>
</html>
