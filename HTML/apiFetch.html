<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> User Details </h2>
    <button id="loadBtn">Load Users</button>
    <p id="status"></p>
    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Brand</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <!--API data will be added here-->
        </tbody>
    </table>

    <script>
        const loadBtn= document.getElementById("loadBtn");
        const userTable= document.getElementById("userTable");
        const status= document.getElementById("status");

        function displayUsers(data){
            userTable.innerHTML = "";
            data.products.forEach((products)=>{
                const row= document.createElement("tr");

                row.innerHTML= `
                <td>${products.title}</td>
                <td>${products.category}</td>
                <td>${products.price}</td>
                <td>${products.brand}</td>`;

                userTable.appendChild(row);
            });
        }

        async function fetchUsers(){
            status.textContent= "Loading Users.....";
            loadBtn.disabled= true;
            userTable.innerHTML=" ";

            try{
                const response= await fetch("https://dummyjson.com/products");

            if(!response.ok){
                throw new Error("Failed to fetch users");
            }
            const data= await response.json();

            //Store API data in Local Storage
            localStorage.setItem("data", JSON.stringify(data));

            //Display the fetched data
            displayUsers(data);

            status.textContent= "Users loaded successfully!";
        } catch(error){
            status.textContent= "Error: "+error.message;
        }finally{
            loadBtn.disabled= false;
        }
    }

    function loadSavedUsers(){
        const savedData= localStorage.getItem("data");
        if(savedData){
            displayUsers(JSON.parse(savedData));
            status.textContent= "Users loaded from Local Storage!";
        }
        else{
            status.textContent= "Click Load Users to fetch data"
        }
    }
    loadBtn.addEventListener("click",fetchUsers);
    </script>
</body>
</html>
